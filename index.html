<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbe Mania: Marine Ecology Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="score">Score: 0</div>
            <div id="size">Size: 10μm</div>
        </div>
        <div id="ui-overlay">
            <div id="message-box">
                <h1 id="ui-title">Welcome to Microbe Mania</h1>
                <div id="selection-screen">
                    <h3>Select Morphotype:</h3>
                    <div class="btn-group" id="morphotype-selection">
                        <button class="select-btn active" data-value="coccus">Coccus</button>
                        <button class="select-btn" data-value="bacillus">Bacillus</button>
                        <button class="select-btn" data-value="spirillum">Spirillum</button>
                    </div>
                    <h3>Select Metabolism:</h3>
                    <div class="btn-group" id="metabolism-selection">
                        <button class="select-btn active" data-value="photo">Photoautotroph</button>
                        <button class="select-btn" data-value="hetero">Heterotroph</button>
                        <button class="select-btn" data-value="chemo">Chemoautotroph</button>
                    </div>
                    <button id="start-btn">Start Game</button>
                </div>
                <div id="game-over-screen" class="hidden">
                    <p id="ui-text"></p>
                    <button id="restart-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
